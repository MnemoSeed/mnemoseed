<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>MnemoSeed console</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%234f8cff'/%3E%3Cpath d='M8 4v5M5.5 6.5h5' stroke='%230f1318' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="/console/styles.css" />
</head>
<body>
  <header class="app-header">
    <img class="brand-logo" src="/console/logo.png" alt="MnemoSeed" />
    <span class="brand-wordmark">MnemoSeed</span>
    <nav class="app-nav" aria-label="Sections">
      <a href="#/dashboard" data-nav="dashboard" class="nav-link">Dashboard</a>
      <a href="#/browse" data-nav="browse" class="nav-link">Memory Browser</a>
      <a href="#/review" data-nav="review" class="nav-link">Dream Review</a>
      <a href="#/conflicts" data-nav="conflicts" class="nav-link">Conflicts</a>
    </nav>
    <label class="profile-picker" title="Active profile (drives every /api/v1 read)">
      <span class="profile-label">profile</span>
      <select id="profile-select" aria-label="Active profile"></select>
    </label>
  </header>
  <main id="app" class="app-main">
    <section id="view" class="view" aria-live="polite">
      <p class="loading">Loading…</p>
    </section>
  </main>
  <footer class="app-footer">
    <span id="updated-at"></span>
    <span>MnemoSeed console &mdash; a local admin surface. No account, no cloud.</span>
  </footer>
  <script src="/console/app.js"></script>
</body>
</html>
