[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemoseed"
version = "0.0.1"
description = "Cross-model neutral AI memory layer — five-stage memory pipeline derived from neuroscience"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tomli; python_version < '3.12'",
]

[project.optional-dependencies]
# embedded 默认栈（个人用户零 Docker）
embedded = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",  # gemma_local 嵌入
]
# Postgres 系备选驱动
postgres = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
mnemoseed = "mnemoseed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemoseed"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
