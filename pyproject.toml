[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemoseed"
version = "0.0.1"
description = "Cross-model neutral AI memory layer — five-stage memory pipeline derived from neuroscience"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    # embedded vector layer: lancedb chunks table + hybrid search (FR-8.3)
    "lancedb>=0.15",
    # bge-m3 embedder: CPU inference + XLM-RoBERTa tokenization (FR-8.3)
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    # vector math shared by the vector/embed drivers (synthetic, bge-m3, lancedb)
    "numpy>=2.0",
    # postgres driver family (FR-8.4): pg_graph / pg_meta / pgvector second drivers.
    # Base deps because the pg drivers are the docker preset defaults and CI
    # imports them under a plain uv sync (AC-1).
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # MCP stdio memory gateway (PRD-03 FR-3.1): official MCP SDK, pinned to 2.x.
    "mcp>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
mnemoseed = "mnemoseed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemoseed"]

# Ship the host adapter/plugin template trees as package data so `mnemoseed
# install` works from an installed wheel (issue #9). The repo-root layout is
# kept as the marketplace-distribution source (design/06 section 2.1); the
# wheel copy lands under the package at a stable, resolution-known location.
# The installer resolves them via mnemoseed.installer.templating.
[tool.hatch.build.force-include]
"adapters" = "src/mnemoseed/_templates/adapters"
"plugins/claude-code" = "src/mnemoseed/_templates/plugins/claude-code"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true

# third-party libs without type stubs / py.typed markers
[[tool.mypy.overrides]]
module = ["pyarrow", "lancedb", "lancedb.query", "onnxruntime"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Hook entry scripts must insert the plugin/adapter dir into sys.path before
# importing the shared client, so import order is intentional there.
"plugins/**" = ["I001", "UP034"]
"adapters/**" = ["I001", "UP034"]
