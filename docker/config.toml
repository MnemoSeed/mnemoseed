# Docker preset config baked into the core image (/etc/mnemoseed/config.toml).
#
# Resolves against the docker-compose.yml network: `vector` and `pg` are the
# compose service hostnames; each pg driver targets its own database so the
# graph and meta schema_version tracks never share a table. The embed layer
# points at the compose `embed` sidecar (dev stub, OpenAI-compatible protocol).

preset = "docker"
baseurl = "http://localhost:7788"

[storage.vector]
dsn = "postgresql://mnemoseed:mnemoseed@vector:5432/mnemoseed_vector"
dimensions = 1024

[storage.graph]
dsn = "postgresql://mnemoseed:mnemoseed@pg:5432/mnemoseed_graph"

[storage.meta]
dsn = "postgresql://mnemoseed:mnemoseed@pg:5432/mnemoseed_meta"

[storage.embed]
base_url = "http://embed:7789/v1"
api_key = "mnemoseed" # any non-empty string; the dev sidecar does not verify it
model = "text-embedding-synthetic"
