services:
  daemon:
    build: .
    ports:
      - "7788:7788"
    volumes:
      - mnemoseed-data:/data
    environment:
      MNEMOSEED_HOME: /data
      STORAGE_MODE: docker
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mnemoseed
      POSTGRES_PASSWORD: mnemoseed
      POSTGRES_DB: mnemoseed
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemoseed"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mnemoseed-data:
  pg-data:
