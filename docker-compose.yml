# MnemoSeed docker preset (prd-08 FR-8.8): core + vector + pg + embed.
#
# Four services, each with a /healthz liveness check:
#   core    - the daemon (FastAPI). Real HTTP /healthz reporting store assembly
#             status and capability-gate findings. Migrations run at boot.
#   vector  - pgvector/pgvector:pg16, hosts the hippocampus chunks table. The
#             pgvector driver creates the `vector` extension and its tables.
#   pg      - postgres:16, hosts the cortex graph + meta on two databases
#             (mnemoseed_graph / mnemoseed_meta, created by ./docker/pg-init).
#             FR-8.8 keeps `vector` and `pg` as separate service entries even
#             though the pgvector image could host both.
#   embed   - the daemon image running the dev OpenAI-compatible embeddings
#             stub (mnemoseed embed-sidecar). Deterministic synthetic dense
#             vectors so the stack boots with no external account or model
#             download. Swap in a real endpoint by overriding
#             STORAGE.EMBED.base_url and dropping this service.
#   ollama  - optional offline dream-model profile (profiles: ["ollama"]), not
#             started by default; docker compose up --profile ollama.
#
# Compose-only facts: vector publishes host 55433, pg 55434 (55432 is reserved
# for the long-running T5 `mnemoseed-pg-it` container; keep it alive).

name: mnemoseed

services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    image: mnemoseed-core
    command: ["mnemoseed", "up", "--host", "0.0.0.0", "--port", "7788"]
    ports:
      - "7788:7788"
    environment:
      MNEMOSEED_HOME: /etc/mnemoseed
    depends_on:
      vector:
        condition: service_healthy
      pg:
        condition: service_healthy
      embed:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:7788/healthz', timeout=2).status == 200 else sys.exit(1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  vector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mnemoseed
      POSTGRES_PASSWORD: mnemoseed
      POSTGRES_DB: mnemoseed_vector
    ports:
      - "55433:5432"
    volumes:
      - vector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemoseed -d mnemoseed_vector"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  pg:
    image: postgres:16
    environment:
      POSTGRES_USER: mnemoseed
      POSTGRES_PASSWORD: mnemoseed
      POSTGRES_DB: mnemoseed_meta
    ports:
      - "55434:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemoseed -d mnemoseed_meta"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  embed:
    image: mnemoseed-core
    command: ["mnemoseed", "embed-sidecar", "--host", "0.0.0.0", "--port", "7789"]
    ports:
      - "7789:7789"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:7789/healthz', timeout=2).status == 200 else sys.exit(1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  vector-data:
  pg-data:
  ollama-data:
