# MnemoSeed docker preset (issue #5): the default compose stack targets END
# USERS -- one service running the embedded daemon, with zero UX difference
# from `mnemoseed up` locally. The developer/enterprise Postgres family moves
# behind the `pg` profile, and the cloud/VPS deployment lives in
# docker-compose.cloud.yml (design/10).
#
#   docker compose up                  -> core only (embedded single-process daemon)
#   docker compose --profile pg up     -> core + vector + pg + embed (Postgres family)
#   docker compose --profile ollama up -> core + ollama (offline dream model)
#   docker compose -f docker-compose.cloud.yml up -d  (VPS: daemon + reverse-proxy TLS)
#
# The core service always runs the embedded daemon (its config home is the
# writable /data volume, so an empty volume resolves the embedded preset by
# default). To point the daemon at the `pg` backplane instead, activate the
# profile AND give it the image-baked docker preset config:
#
#   MNEMOSEED_HOME=/etc/mnemoseed docker compose --profile pg up
#
# (the baked /etc/mnemoseed/config.toml resolves the pg drivers against the
# compose hostnames vector/pg/embed; core retries until they are healthy via
# restart: unless-stopped). One Project = one daemon service -- compose cannot
# vary a service's configuration per profile, so the daemon is configured by
# its config home rather than by a second service literal.

name: mnemoseed

services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    image: mnemoseed-core
    command: ["mnemoseed", "up", "--host", "0.0.0.0", "--port", "7788"]
    ports:
      - "7788:7788"
    environment:
      MNEMOSEED_HOME: /data
    volumes:
      - mnemoseed-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:7788/healthz', timeout=2).status == 200 else sys.exit(1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # ---- developer/enterprise Postgres family (opt-in: --profile pg) ----
  # vector  - pgvector/pgvector:pg16, hosts the hippocampus chunks table. The
  #           pgvector driver creates the `vector` extension and its tables.
  # pg      - postgres:16, hosts the cortex graph + meta on two databases
  #           (mnemoseed_graph / mnemoseed_meta, created by ./docker/pg-init).
  #           vector and pg are separate service entries even though the
  #           pgvector image could host both.
  # embed   - the daemon image running the dev OpenAI-compatible embeddings
  #           stub (mnemoseed embed-sidecar). Deterministic synthetic dense
  #           vectors so the stack boots with no external account or model
  #           download. Swap in a real endpoint by overriding
  #           STORAGE.EMBED.base_url and dropping this service.
  #
  # Compose-only facts: vector publishes host 55433, pg 55434 (55432 is
  # reserved for the long-running T5 `mnemoseed-pg-it` container; keep it
  # alive).
  vector:
    profiles: ["pg"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mnemoseed
      POSTGRES_PASSWORD: mnemoseed
      POSTGRES_DB: mnemoseed_vector
    ports:
      - "55433:5432"
    volumes:
      - vector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemoseed -d mnemoseed_vector"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  pg:
    profiles: ["pg"]
    image: postgres:16
    environment:
      POSTGRES_USER: mnemoseed
      POSTGRES_PASSWORD: mnemoseed
      POSTGRES_DB: mnemoseed_meta
    ports:
      - "55434:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemoseed -d mnemoseed_meta"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  embed:
    profiles: ["pg"]
    image: mnemoseed-core
    command: ["mnemoseed", "embed-sidecar", "--host", "0.0.0.0", "--port", "7789"]
    ports:
      - "7789:7789"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:7789/healthz', timeout=2).status == 200 else sys.exit(1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # optional offline dream-model profile (profiles: ["ollama"]), not started
  # by default; docker compose up --profile ollama
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mnemoseed-data:
  vector-data:
  pg-data:
  ollama-data:
